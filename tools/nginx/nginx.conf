user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	client_max_body_size 50M;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	# HTTP redirect to HTTPS
	server {
		listen 80;
		server_name libuli.top www.libuli.top dev.libuli.top;
		return 301 https://$host$request_uri;
	}

	# web-mobile 正式环境
	server {
		listen 8000;
		listen 443 ssl;
		server_name libuli.top www.libuli.top;

		ssl_certificate files/libuli.top_bundle.pem;
		ssl_certificate_key files/libuli.top.key;

		root /data/morpheus-ai/front/morpheus-ai-web-mobile;
		index index.html index.htm;

		location / {
			try_files $uri $uri/ /index.html;
		}

		location /api/v1 {
			proxy_pass http://127.0.0.1:3000/api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/file/ {
			proxy_pass http://127.0.0.1:9000/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	# web-mobile 测试环境
	server {
		listen 8001;
		listen 443 ssl;
		server_name dev.libuli.top;

		ssl_certificate files/dev.libuli.top_bundle.pem;
		ssl_certificate_key files/dev.libuli.top.key;

		root /data/morpheus-ai/front/morpheus-ai-web-mobile-test;
		index index.html index.htm;

		location / {
			try_files $uri $uri/ /index.html;
		}

		location /api/v1 {
			proxy_pass http://127.0.0.1:3001/api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/file/ {
			proxy_pass http://127.0.0.1:9000/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
